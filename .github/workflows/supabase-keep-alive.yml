name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC (al mediodía)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Enviar petición Keep-Alive a Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Las variables NEXT_PUBLIC_SUPABASE_URL o NEXT_PUBLIC_SUPABASE_ANON_KEY no están configuradas en los Secrets del repositorio en GitHub."
            echo "Por favor agrégalas en: Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi

          # Limpiar posibles barras diagonales finales de la URL
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Enviando ping a Supabase: $CLEAN_URL"

          # Realizar una consulta REST a la tabla tramites_08
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/tramites_08?select=id&limit=1")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Código HTTP recibido: $HTTP_STATUS"
          echo "Respuesta: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Ping a Supabase exitoso. La base de datos permanecerá activa."
          else
            echo "❌ Error al comunicarse con Supabase (Status: $HTTP_STATUS)"
            exit 1
          fi
